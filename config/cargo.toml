[alias]
i = "auditable install --locked --profile dist"
iu = "auditable install-update --locked --git --all --jobs 1 --downdate --allow-no-update"

[build]
# fedora: from cargo, to install do env RUSTC_WRAPPER= cargo...
rustc-wrapper = "sccache"
jobs = -2
rustflags = ["-Ctarget-cpu=native", "-Cforce-frame-pointers=yes"]
target-dir = "build"

[target.x86_64-unknown-linux-musl]
# cc = { "musl-clang"}
rustflags = [
  # verify with `readelf -p .comment`
  "-Clinker=rust-lld",
  "-Ctarget-cpu=native",
  "-Cforce-frame-pointers=yes",
]

[target.x86_64-unknown-linux-gnu]
rustflags = [
  # verify with `readelf -p .comment`
  "-Clinker=clang",
  "-Clink-arg=--ld-path=mold",
  "-Ctarget-cpu=native",
  "-Cforce-frame-pointers=yes",
  "-Znext-solver=coherence",
]

[profile.dist]
# from cargo-dist
inherits = "release"
lto = "thin"
# https://nnethercote.github.io/perf-book/build-configuration.html
strip = "debuginfo"

[profile.profiling]
inherits = "release"
debug = true
