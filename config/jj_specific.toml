# https://v5.chriskrycho.com/notes/jj-tip-ignore-gh-pages-by-default/
# https://oppi.li/posts/configuring_jujutsu/
# https://gist.github.com/thoughtpolice/8f2fd36ae17cd11b8e7bd93a70e31ad6#file-jjconfig-toml

# Schema published automatically on the website. This allows TOML language
# servers to autocomplete and show documentation for the entries below.
"$schema" = "https://jj-vcs.github.io/jj/prerelease/config-schema.json"

[aliases]
tug = ["bookmark", "move", "--from", "heads(::@- & bookmarks())", "--to", "@-"]

[revset-aliases]
ghp = 'ancestors(bookmarks(gh-pages) | remote_bookmarks(gh-pages))'
"immutable_heads()" = "builtin_immutable_heads() | ghp"
ahead-behind = "trunk()..@ | @..trunk() | trunk() | @:: | fork_point(trunk() | @)"

[templates]
commit_trailers = "format_signed_off_by_trailer(self)"
draft_commit_description = '''
  concat(
    "JJ: -*- mode: diff -*-\n\n",
    coalesce(description, default_commit_description, ""),
    surround(
      "\nJJ: This commit contains the following changes:\n", "",
      indent("JJ:     ", diff.stat(72)),
      ),
     "\nJJ: ignore-rest\n",
    diff.git(),
  )
'''

[template-aliases]
"format_short_id(i)" = "i.shortest()"

'hyperlink(url, text)' = '''
  concat(
    raw_escape_sequence("\e]8;;" ++ url ++ "\e\\"),
    label("text link", text),
    raw_escape_sequence("\e]8;;\e\\"),
  )
'''
