# MOZ_LOG=IMEHandler:4,sync

# kde says no
# GTK_IM_MODULE=ibus
# QT_IM_MODULE=ibus
# don't enable in emacs XMODIFIERS="@im=ibus"

MALLOC_CONF=thp:always,metadata_thp:always

DEBUGINFOD_URLS="https://debuginfod.elfutils.org/ https://debuginfod.debian.net/ https://debuginfod.fedoraproject.org/ https://debuginfod.archlinux.org/ https://debuginfod.ubuntu.com/"
OTEL_EXPORTER_OTLP_ENDPOINT=http://127.0.0.1:4318

